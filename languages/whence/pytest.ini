# Owned pytest config for languages/whence (round 349, harness A).
#
# WHY THIS FILE EXISTS — it is not about settings, it is about OWNERSHIP.
#
# Round 348's whence-health-check went red for the first time in the
# program's history with a message that named no test:
#
#   round 348: whence-health-check FAIL — ERROR: .../pyproject.toml:
#   Cannot declare ('project', 'optional-dependencies') twice
#   (at line 29, column 31)
#
# All 1043 fast-tier tests were down. Nothing in this program had changed.
# `languages/whence/pyproject.toml` is UNTRACKED — it is one of the files a
# separate autonomous system (the Hermes gateway) leaves behind, and
# `state/known-standing-dirty-paths.json` has allowlisted it since round
# 291 precisely so that no round treats it as its own work. That system
# appended a second `[project.optional-dependencies]` table to it, which is
# a TOML error; pytest parses every candidate config file in the rootdir
# during inifile DISCOVERY, before it collects anything, so the parse error
# aborts the run outright.
#
# The program never needed that file: the only pytest configuration whence
# has ever required is the `whence_slow` marker, and `tests/conftest.py`
# registers it in `pytest_configure`. The test suite's ability to run was
# resting on the syntactic validity of a file no round is allowed to own.
#
# With `-c` pointed here (see run_tests_fast.sh), pytest stops scanning for
# a config file and never opens pyproject.toml. Measured round 349, against
# the still-broken file: `-c` collects 1043/1095; `--rootdir` alone still
# hard-errors, so --rootdir is NOT a substitute.
#
# Keep this file TRACKED in git. That is the whole point.
[pytest]
